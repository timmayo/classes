<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Feedback</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --border: #e5e7eb;
    --error: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px 16px 64px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 1.5rem; margin: 0; }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    transition: background 0.15s ease;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--border); }

  #feedback-list { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .class-title {
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--accent);
    background: #eff6ff;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .meta { font-size: 0.8rem; color: var(--muted); }
  .name { font-weight: 600; margin-bottom: 4px; }
  .feedback-text { line-height: 1.5; white-space: pre-wrap; }

  .empty, .loading { color: var(--muted); text-align: center; padding: 40px 0; }

  /* Modal / form overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 440px;
  }
  .modal h2 { margin-top: 0; font-size: 1.2rem; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  input[type="password"], input[type="text"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
  }
  textarea { min-height: 100px; resize: vertical; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .status-msg { font-size: 0.9rem; margin-top: 10px; }
  .status-msg.error { color: var(--error); }
  .status-msg.success { color: var(--success); }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Class Feedback</h1>
    <button class="btn-primary" id="open-form-btn">Share Feedback</button>
  </header>

  <div id="feedback-list">
    <div class="loading">Loading feedback…</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Share Feedback</h2>
    <form id="feedback-form">
      <div class="field">
        <label for="password">Class Password</label>
        <input type="password" id="password" required autocomplete="off">
      </div>
      <div class="field">
        <label for="name">Name (optional)</label>
        <input type="text" id="name" autocomplete="off">
      </div>
      <div class="field">
        <label for="feedback">Feedback</label>
        <textarea id="feedback" required></textarea>
      </div>
      <div id="status-msg" class="status-msg"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn-primary" id="submit-btn">Submit</button>
      </div>
    </form>
  </div>
</div>

<script>
  // ---- Configuration: your Power Automate HTTP trigger URLs ----
  const GET_FEEDBACK_URL = "https://d5753d79c5f9e75bbb0e8769af2df5.0e.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/02/workflows/f19d3f288d624601ba307c16a771b1ea/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=r7UDalM3DPdRamKSc7qUZkTgozzU-MgrW0mbY2AHqEA";
  const SUBMIT_FEEDBACK_URL = "https://d5753d79c5f9e75bbb0e8769af2df5.0e.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/07/workflows/eeedf2175224469b983f22ab49452372/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=jU7BRu_E-8g3WutYsyFwfHdSzEMuCAyMGuyEn25UM4I";

  const listEl = document.getElementById("feedback-list");
  const overlay = document.getElementById("overlay");
  const openBtn = document.getElementById("open-form-btn");
  const cancelBtn = document.getElementById("cancel-btn");
  const form = document.getElementById("feedback-form");
  const submitBtn = document.getElementById("submit-btn");
  const statusMsg = document.getElementById("status-msg");

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  function formatTimestamp(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  async function loadFeedback() {
    listEl.innerHTML = '<div class="loading">Loading feedback…</div>';
    try {
      const res = await fetch(GET_FEEDBACK_URL);
      if (!res.ok) throw new Error("Request failed: " + res.status);
      const items = await res.json();

      if (!Array.isArray(items) || items.length === 0) {
        listEl.innerHTML = '<div class="empty">No feedback yet.</div>';
        return;
      }

      // Newest first
      items.sort((a, b) => new Date(b.Timestamp) - new Date(a.Timestamp));

      listEl.innerHTML = items.map(item => `
        <div class="card">
          <div class="card-top">
            <span class="class-title">${escapeHtml(item.ClassTitle || "Unknown Class")}</span>
            <span class="meta">${escapeHtml(formatTimestamp(item.Timestamp))}</span>
          </div>
          <div class="name">${escapeHtml(item.Name && item.Name.trim() ? item.Name : "Anonymous")}</div>
          <div class="feedback-text">${escapeHtml(item.Feedback)}</div>
        </div>
      `).join("");
    } catch (err) {
      console.error("Failed to load feedback:", err);
      listEl.innerHTML = '<div class="empty">Couldn\'t load feedback right now. Please refresh to try again.</div>';
    }
  }

  function openModal() {
    overlay.classList.add("open");
    statusMsg.textContent = "";
    statusMsg.className = "status-msg";
  }

  function closeModal() {
    overlay.classList.remove("open");
    form.reset();
  }

  openBtn.addEventListener("click", openModal);
  cancelBtn.addEventListener("click", closeModal);
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) closeModal();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting…";
    statusMsg.textContent = "";
    statusMsg.className = "status-msg";

    const payload = {
      password: document.getElementById("password").value,
      name: document.getElementById("name").value,
      feedback: document.getElementById("feedback").value
    };

    try {
      const res = await fetch(SUBMIT_FEEDBACK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (res.status === 401) {
        statusMsg.textContent = "Incorrect password. Please try again.";
        statusMsg.className = "status-msg error";
        return;
      }
      if (!res.ok) throw new Error("Request failed: " + res.status);

      statusMsg.textContent = "Thanks for your feedback!";
      statusMsg.className = "status-msg success";
      setTimeout(() => {
        closeModal();
        loadFeedback();
      }, 900);
    } catch (err) {
      console.error("Failed to submit feedback:", err);
      statusMsg.textContent = "Something went wrong. Please try again.";
      statusMsg.className = "status-msg error";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Submit";
    }
  });

  loadFeedback();
</script>

</body>
</html>
